<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors connexion — Bokonzi</title>
  <style>
    html,body{margin:0;height:100%;background:#0d1117;color:#f0f6fc;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      gap:16px;text-align:center;padding:24px;box-sizing:border-box;}
    .logo{font-size:30px;font-weight:800;letter-spacing:-1px;
      background:linear-gradient(135deg,#a78bfa,#ec4899,#f59e0b);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    h1{font-size:18px;margin:6px 0;}
    p{color:#8b949e;font-size:14px;line-height:1.6;max-width:320px;margin:0;}
    button{margin-top:10px;padding:13px 26px;border:none;border-radius:10px;
      background:#6c5ce7;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
    button:active{transform:scale(.97);}
  </style>
</head>
<body>
  <div class="logo">BOKONZI</div>
  <h1>Pas de connexion</h1>
  <p>Impossible de joindre Bokonzi pour le moment. Vérifiez votre connexion internet puis réessayez.</p>
  <button onclick="location.href='https://bokonzi.com'">Réessayer</button>
</body>
</html>
